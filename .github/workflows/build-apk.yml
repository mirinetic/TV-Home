name: Build TV Home APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk TVHome.apk

      - name: Describe this build
        id: info
        run: |
          echo "version=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          printf '%s (%s)' "$(git log -1 --format=%s)" "$(git rev-parse --short HEAD)" > notes.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TVHome-${{ steps.info.outputs.version }}
          path: TVHome.apk

      - name: Release v1.0.N
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.info.outputs.version }}
        run: |
          gh release create "v${VERSION}" TVHome.apk \
            --repo "${GITHUB_REPOSITORY}" \
            --title "TV Home ${VERSION}" \
            --notes-file notes.txt \
            --target "$(git rev-parse HEAD)"
